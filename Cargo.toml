[package]
name = "kai"
version = "1.0.0"
edition = "2021"
description = "Người bạn robot nhỏ trên màn hình GNOME (GTK4 + Cairo)"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
pangocairo = "0.20"
chrono = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
